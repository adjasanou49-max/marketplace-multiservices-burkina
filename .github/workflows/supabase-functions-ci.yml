name: Supabase Edge Functions CI

on:
  push:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-functions-ci.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-functions-ci.yml'

permissions:
  contents: write

jobs:
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format
        run: deno fmt supabase/functions

      - name: Persist formatting on pushes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/functions; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions
          git commit -m "style: format Supabase Edge Functions"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Format check on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- supabase/functions

      - name: Lint
        run: deno lint supabase/functions

      - name: Type check Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Checking $file"
            deno check "$file"
          done < <(find supabase/functions -type f -name '*.ts' -print | sort)
