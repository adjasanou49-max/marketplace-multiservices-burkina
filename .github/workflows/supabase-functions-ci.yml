name: Supabase Edge Functions CI

on:
  push:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-functions-ci.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-functions-ci.yml'

permissions:
  contents: read

jobs:
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check supabase/functions

      - name: Lint
        run: deno lint supabase/functions

      - name: Type check Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Checking $file"
            deno check "$file"
          done < <(find supabase/functions -type f -name '*.ts' -print | sort)
