name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Scan repository for embedded secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect high-confidence secret patterns
        shell: bash
        run: |
          set -euo pipefail
          failed=0

          patterns=(
            'SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{20,}'
            'SUPABASE_SECRET_KEYS[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{20,}'
            'CINETPAY_(API_KEY|SECRET_KEY)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{12,}'
            'WAVE_(API_KEY|SIGNING_SECRET|WEBHOOK_SECRET)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{12,}'
            'ghp_[A-Za-z0-9]{20,}'
            'github_pat_[A-Za-z0-9_]{40,}'
            'sk_(live|test)_[A-Za-z0-9]{16,}'
            'AKIA[0-9A-Z]{16}'
          )

          for pattern in "${patterns[@]}"; do
            if matches="$(git grep -n -I -E -- "$pattern" -- . || true)"; then
              if [[ -n "$matches" ]]; then
                printf 'Potential embedded secret found for pattern: %s\n%s\n' "$pattern" "$matches"
                failed=1
              fi
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo "Secret scan failed. Keep production credentials in Supabase/GitHub secret storage, never in source."
            exit 1
          fi

          echo "No high-confidence embedded secrets detected."
