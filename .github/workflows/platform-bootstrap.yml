name: Persist Flutter mobile platforms
on:
  push:
    branches: [codex/bootstrap]
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/bootstrap
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Generate Android and iOS
        run: flutter create --platforms=android,ios --project-name marketplace_multiservices_burkina .
      - name: Commit platform scaffolds when changed
        run: |
          if git diff --quiet -- android ios; then
            echo 'Platforms already persisted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android ios
          git commit -m 'chore: persist Flutter Android and iOS platforms'
          git push origin HEAD:codex/bootstrap