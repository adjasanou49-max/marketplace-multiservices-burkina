name: Flutter CI
on:
  push:
    branches: [main, codex/bootstrap]
  pull_request:
    branches: [main]

concurrency:
  group: flutter-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap-platforms:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Generate Android and iOS projects when missing
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --platforms=android,ios --project-name marketplace_multiservices_burkina .
          fi
      - name: Persist generated platform projects
        run: |
          if git diff --quiet -- android ios; then
            echo "No platform scaffold changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios
          git commit -m "chore: persist Flutter Android and iOS scaffolds"
          git push origin HEAD:${{ github.ref_name }}

  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Check generated dependency changes
        run: git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Format Dart sources
        run: dart format lib test
      - run: flutter analyze
      - run: flutter test

  android-debug:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v6
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - name: Ensure Android platform project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name marketplace_multiservices_burkina .
          fi
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: flutter build apk --debug
      - run: flutter build appbundle --debug
