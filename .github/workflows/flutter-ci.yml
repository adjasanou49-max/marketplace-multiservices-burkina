name: Flutter CI
on:
  push:
    branches: [main, codex/bootstrap]
  pull_request:
    branches: [main, codex/bootstrap]

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android-debug:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'
          cache: true
      - run: flutter pub get
      - name: Ensure Android platform project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name marketplace_multiservices_burkina .
          fi
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
      - run: flutter build apk --debug
      - run: flutter build appbundle --debug
